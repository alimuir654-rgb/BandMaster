name: Art material native experiment
'on':
  push:
    branches: [dual-frame-proof-2026-10-28]
    paths: ['.github/workflows/art-material-proof.yml', 'experiments/art_material/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-material-proof
  cancel-in-progress: true
jobs:
  native-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ROOT: frame-proof/BandMaster_Frame_Experiment
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Acquire pinned original sources and successful baseline instructions
        run: |
          git fetch --depth=1 origin c084690f7ccde4625eaebf68b89ae476fd08724d
          mkdir -p art-sources proof-shots
          git archive FETCH_HEAD Art bandmaster_premium_controls_lab bandmaster_premium_dashboard_poc docs/PREMIUM_HARDWARE_SOURCE_INTAKE.md | tar -x -C art-sources
          git fetch --depth=1 origin 981bbdcd8908049ddc72f71606461676520e8630
          git show FETCH_HEAD:.github/workflows/dual-frame-native-proof.yml > /tmp/verified-baseline.yml
      - name: Install pinned engine and real renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri python3-pil python3-yaml
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Build materials and validate actual scenes before rendering
        run: |
          python3 - <<'PY'
          import yaml, subprocess, os
          from pathlib import Path
          steps=yaml.safe_load(open('/tmp/verified-baseline.yml'))['jobs']['native']['steps']
          def run(name):
              step=next(s for s in steps if s.get('name')==name)
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          run('Extract original ZIP and load pinned canonical catalogue')
          run('Repair actual source and both scene bindings before import')
          subprocess.run(['python3','experiments/art_material/prepare_art.py'],check=True)
          subprocess.run(['python3','experiments/art_material/refine_art.py'],check=True)
          subprocess.run(['python3','experiments/art_material/build_passive_meter_kit.py'],check=True)
          subprocess.run(['python3','experiments/art_material/build_frame_kit.py'],check=True)
          subprocess.run(['python3','experiments/art_material/build_direct_control_kit.py'],check=True)
          subprocess.run(['python3','experiments/art_material/build_u04_control_assembly.py'],check=True)
          subprocess.run(['python3','experiments/art_material/integrate_preview_characters.py','--phase','install'],check=True)
          run('Create native interaction and screenshot test')
          subprocess.run(['python3','experiments/art_material/integrate_preview_characters.py','--phase','patch-test'],check=True)
          import shutil
          shutil.copy2('experiments/art_material/u04_native_capture.gd',Path(os.environ['ROOT'])/'tests/u04_native_capture.gd')
          p=Path(os.environ['ROOT'])/'tests/native_proof.gd'
          s=p.read_text()
          marker='check(scene.stat_rows.get_child_count() == 6, "Wrong attribute count " + prefix)'
          assert marker in s
          s=s.replace(marker,marker+'\n            check(Rect2(Vector2.ZERO,Vector2(sz)).encloses(scene.stat_rows.get_global_rect()), "Stats offscreen " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.portrait.get_theme_stylebox("panel") is StyleBoxTexture, "Source portrait bezel missing " + prefix)\n            check(scene.tablet_sheet.visible == (sz.x >= 600 and sz.x < 900), "Tablet composition wrong " + prefix)\n            check(scene.status.get_global_rect().end.y < sz.y - 32 if sz.x < 500 else true, "Footer too low " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.tabs[0].toggle_mode and scene.tabs[0].button_pressed and not scene.tabs[0].disabled, "Selected role incorrectly disabled " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.candidate_buttons[0].toggle_mode and scene.candidate_buttons[0].button_pressed and not scene.candidate_buttons[0].disabled, "Selected candidate incorrectly disabled " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.recruit_button.get_meta("source_kit", "") == "U03_Lab07_Tactile", "Direct control skin not bound " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.tabs[0].get_theme_stylebox("pressed") is StyleBoxTexture, "No role pressed sprite " + prefix)')
          s=s.replace(marker,marker+'\n            check(scene.tabs[0].get_theme_stylebox("disabled") is StyleBoxTexture, "No role disabled sprite " + prefix)')
          s=s.replace(marker,marker+'\n            for row in scene.stat_rows.get_children():\n                var meter := row.get_node_or_null("ReadOnlyMeter") as TextureRect\n                check(meter != null and meter.mouse_filter == Control.MOUSE_FILTER_IGNORE and meter.focus_mode == Control.FOCUS_NONE, "Passive stat accepts input " + prefix)')
          p.write_text(s)
          PY
      - name: Render and verify 32 source-backed material states
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import yaml, subprocess
          steps=yaml.safe_load(open('/tmp/verified-baseline.yml'))['jobs']['native']['steps']
          for name in ['Render 32 screenshots and verify interactions and live resize','Reject duplicate themes and publish review index']:
              step=next(s for s in steps if s.get('name')==name)
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
          cp "$ROOT/MATERIAL_MANIFEST.json" proof-shots/
          cp "$ROOT/PASSIVE_METER_MANIFEST.json" proof-shots/
          cp "$ROOT/FRAME_KIT_MANIFEST.json" proof-shots/
          cp "$ROOT/DIRECT_CONTROL_MANIFEST.json" proof-shots/
          cp "$ROOT/C05_PREVIEW_MANIFEST.json" proof-shots/
          timeout 100s xvfb-run -a -s '-screen 0 1920x1440x24' godot --rendering-method gl_compatibility --audio-driver Dummy --path "$ROOT" --script res://tests/u04_native_capture.gd 2>&1 | tee proof-shots/u04-native.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' proof-shots/u04-native.log; then exit 1; fi
          cp "$ROOT"/proof-shots/u04-*.png proof-shots/
          cp "$ROOT"/proof-shots/u04-results.json proof-shots/
          cp "$ROOT/U04_CONTROL_MANIFEST.json" proof-shots/
          cp "$ROOT/assets/material/u04_control_value_atlas.png" proof-shots/
          cp "$ROOT/assets/material/direct_control_atlas.png" proof-shots/
          cp "$ROOT/assets/material/frame_kit_atlas.png" proof-shots/
          cp "$ROOT/assets/material/passive_meter_atlas.png" proof-shots/
          cp "$ROOT/assets/material/SOURCE_PHOTO_MANIFEST.json" proof-shots/
          cp art-sources/docs/PREMIUM_HARDWARE_SOURCE_INTAKE.md proof-shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-material-native-proof
          path: |
            proof-shots/
            frame-proof/BandMaster_Frame_Experiment/scene/frame_demo.gd
            frame-proof/BandMaster_Frame_Experiment/assets/material/
            frame-proof/BandMaster_Frame_Experiment/bandmaster_premium_dashboard_poc/
          retention-days: 14
          compression-level: 1
