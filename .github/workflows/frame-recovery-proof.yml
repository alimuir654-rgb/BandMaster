name: C22 controlled paper-frame recovery proof
'on':
  push:
    branches: [dual-frame-proof-2026-10-28]
    paths: ['.github/workflows/frame-recovery-proof.yml','experiments/frame_recovery/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frame-recovery-proof
  cancel-in-progress: false
jobs:
  native-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require the committed lessons review before frame work
        run: |
          python3 tools/improvement_gate.py check --session docs/continuous_improvement/sessions/C22.json --before "$(git rev-parse HEAD^)" --require-prior-record
          python3 -m unittest discover -s tests -p test_improvement_gate.py -q
      - name: Install existing pinned engine and real renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri python3-pil
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Reuse published C21 logic and pinned original cork material
        run: |
          git fetch --depth=1 origin c084690f7ccde4625eaebf68b89ae476fd08724d
          mkdir -p /tmp/c22-source
          git show FETCH_HEAD:Art/Photography/Formation/corkboard_day_pexels.webp > /tmp/c22-source/cork.webp
          git show FETCH_HEAD:Art/Photography/Formation/SOURCE_PHOTO_MANIFEST.json > /tmp/c22-source/photos.json
          python3 -m py_compile experiments/frame_recovery/build.py
          python3 experiments/frame_recovery/build.py --source components/control_atlas --out frame-proof-c22 --cork /tmp/c22-source/cork.webp --cork-manifest /tmp/c22-source/photos.json
          cp experiments/frame_recovery/comparison.gd.in frame-proof-c22/comparison.gd
          set -o pipefail
          timeout 90s godot --headless --audio-driver Dummy --path frame-proof-c22 --editor --quit 2>&1 | tee frame-proof-c22/proof/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' frame-proof-c22/proof/import.log; then exit 1; fi
      - name: Run preserved regression suites and identical-layout comparison
        run: |
          set -o pipefail
          for script in native_test frame_test frame_stress_test comparison; do
            timeout 180s xvfb-run -a -s '-screen 0 1920x1440x24' godot --rendering-method gl_compatibility --audio-driver Dummy --path frame-proof-c22 --script res://$script.gd 2>&1 | tee frame-proof-c22/proof/$script.log
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' frame-proof-c22/proof/$script.log; then exit 1; fi
          done
      - name: Test the same scoped library in a separate host
        run: |
          set -o pipefail
          python3 experiments/control_atlas/export_module.py --source frame-proof-c22 --target host-proof-c22
          timeout 90s godot --headless --audio-driver Dummy --path host-proof-c22 --editor --quit 2>&1 | tee host-proof-c22/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' host-proof-c22/import.log; then exit 1; fi
          for script in native_test frame_test frame_stress_test comparison; do
            timeout 180s xvfb-run -a -s '-screen 0 1920x1440x24' godot --rendering-method gl_compatibility --audio-driver Dummy --path host-proof-c22 --script res://components/control_atlas/$script.gd 2>&1 | tee host-proof-c22/$script.log
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' host-proof-c22/$script.log; then exit 1; fi
          done
      - name: Verify protected sources and package candidate without art approval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,zipfile,shutil
          for root in [Path('frame-proof-c22'),Path('host-proof-c22/components/control_atlas')]:
              for name,count in [('results.json',48),('frame-results.json',16),('stress-results.json',8),('recovery-results.json',12)]:
                  f=root/'proof'/name;r=json.loads(f.read_text());assert not r['failures'] and len(r['screenshots'])==count
                  for item in r['screenshots']:
                      p=root/'proof'/item['file']
                      with Image.open(p) as im:assert list(im.size)==item['size'];im.verify()
                      item['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
                  f.write_text(json.dumps(r,indent=2)+'\n')
          p=Path('frame-proof-c22');manifest=json.loads((p/'FRAME_RECOVERY_C22.json').read_text())
          for name,digest in manifest['protected_originals'].items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest
          with zipfile.ZipFile('BandMaster_C22_Testable_Frame_Recovery.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in p.rglob('*'):
                  if f.is_file() and not any(s in f.parts for s in ['proof','.godot','__pycache__']) and f.suffix not in ['.import','.uid','.ttf','.otf']:
                      z.write(f,Path('BandMaster_C22_Frame_Recovery')/f.relative_to(p))
          shutil.move('BandMaster_C20_Drop_In_Library.zip','BandMaster_C22_Candidate_Library.zip')
          print('Candidate only. Native tests do not authorise visual promotion.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c22-frame-recovery-native-proof
          path: |
            frame-proof-c22/proof/
            frame-proof-c22/FRAME_RECOVERY_C22.json
            frame-proof-c22/FRAME_STYLES_C21.json
            host-proof-c22/components/control_atlas/proof/*.json
            host-proof-c22/*.log
            BandMaster_C22_Testable_Frame_Recovery.zip
            BandMaster_C22_Candidate_Library.zip
          retention-days: 30
