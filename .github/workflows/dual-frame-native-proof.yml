name: Dual frame native Godot proof
on:
  push:
    branches: [dual-frame-proof-2026-10-28]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch uploaded ZIP from main
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:BandMaster_Frame_Experiment_v2.zip > BandMaster_Frame_Experiment_v2.zip
      - name: Extract experiment and inspect structure
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          z=zipfile.ZipFile("BandMaster_Frame_Experiment_v2.zip")
          for n in z.namelist():
              p=pathlib.PurePosixPath(n)
              if p.is_absolute() or ".." in p.parts: raise RuntimeError(n)
          z.extractall("frame-proof")
          print("\n".join(z.namelist()))
          PY
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Find project and run native import
        run: |
          PROJECT=$(find frame-proof -name project.godot -print -quit)
          test -n "$PROJECT"
          ROOT=$(dirname "$PROJECT")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          godot --headless --path "$ROOT" --editor --quit
      - name: Fix Godot Control material identifier collision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path(os.environ["ROOT"])/"scene/frame_demo.gd"
          s=p.read_text()
          s=re.sub(r"\bmaterial\b", "frame_material_kind", s)
          s=re.sub(r"(?m)^([ \t]*)layout\.orientation\s*=\s*(?:VERTICAL|HORIZONTAL)\s*$", r"\1pass # invalid HBox orientation removed", s)
          p.write_text(s)
          print("Fixed Control.material naming collision")
          PY
      - name: Native smoke test
        run: |
          TEST=$(find "$ROOT" -iname '*smoke*.gd' -print -quit)
          if [ -n "$TEST" ]; then
            godot --headless --path "$ROOT" --script "${TEST#"$ROOT"/}"
          else
            echo "No smoke test found" >&2; exit 1
          fi
      - name: Capture actual Godot scene pixels
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri python3-pil
          mkdir -p proof-shots
          cat > "$ROOT/capture_proof.gd" <<'GDS'
          extends SceneTree
          func _initialize() -> void:
              call_deferred("_capture")
          func _capture() -> void:
              var files: Array[String] = []
              _collect("res://", files)
              var scenes: Array[String] = []
              for file in files:
                  if file.ends_with(".tscn") and not file.contains("test"):
                      scenes.append(file)
              scenes.sort()
              print("SCENES: ", scenes)
              if scenes.size() < 2:
                  push_error("Expected at least two scenes")
                  quit(2)
                  return
              var sizes = [Vector2i(390,844), Vector2i(720,1280), Vector2i(1280,720), Vector2i(1600,900)]
              for scene_path in scenes:
                  var packed = load(scene_path)
                  if not packed is PackedScene:
                      continue
                  for sz in sizes:
                      var window := Window.new()
                      window.size = sz
                      window.position = Vector2i.ZERO
                      window.unresizable = true
                      window.mode = Window.MODE_WINDOWED
                      root.add_child(window)
                      var instance = packed.instantiate()
                      window.add_child(instance)
                      await process_frame
                      await process_frame
                      await process_frame
                      var image = window.get_texture().get_image()
                      var base = scene_path.get_file().get_basename()
                      var output = "res://proof-shots/" + base + "-" + str(sz.x) + "x" + str(sz.y) + ".png"
                      var err = image.save_png(output)
                      if err != OK:
                          push_error("Screenshot save failed " + output + " " + str(err))
                          quit(3)
                          return
                      print("CAPTURED ", output, " ", image.get_size())
                      window.queue_free()
                      await process_frame
              quit(0)
          func _collect(dirpath: String, files: Array[String]) -> void:
              var dir = DirAccess.open(dirpath)
              if dir == null: return
              dir.list_dir_begin()
              while true:
                  var n = dir.get_next()
                  if n == "": break
                  if n.begins_with("."): continue
                  var p = dirpath.path_join(n)
                  if dir.current_is_dir():
                      _collect(p, files)
                  else:
                      files.append(p)
              dir.list_dir_end()
          GDS
          mkdir -p "$ROOT/proof-shots"
          xvfb-run -a godot --rendering-method gl_compatibility --path "$ROOT" --script res://capture_proof.gd
          cp "$ROOT"/proof-shots/*.png proof-shots/
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          shots=list(Path("proof-shots").glob("*.png"))
          assert len(shots)>=8, f"Only {len(shots)} screenshots"
          for p in shots:
              im=Image.open(p); im.verify()
              print(p, Image.open(p).size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-frame-native-proof
          path: |
            proof-shots/
            frame-proof/
