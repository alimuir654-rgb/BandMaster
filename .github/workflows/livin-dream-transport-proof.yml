name: Livin The Dream transport hardware proof
on:
  push:
    branches: [visual-proof-transport-and-scene-quality-gates]
  workflow_dispatch:
jobs:
  transport-visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2, Xvfb and rendering libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip libgl1 libx11-6
          curl --fail --location --retry 3 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import all source and verify Lab07 transport contract
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path . --editor --import --quit 2>&1 | tee /tmp/proof-import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:' /tmp/proof-import.log
          godot --headless --audio-driver Dummy --path . --script res://tests/premium_transport_proof_tests.gd 2>&1 | tee /tmp/proof-test.log
          grep -q 'TRANSPORT PHOTO FAMILY TESTS PASSED' /tmp/proof-test.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|TRANSPORT PROOF FAILURE:|ERROR:' /tmp/proof-test.log
      - name: Capture 36 real day/dusk/night native transport states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for dims in 390x844 720x1280 1280x720 1600x900; do
            w="${dims%x*}"; h="${dims#*x}"
            for phase in day dusk night; do
              for state in standby armed locked; do
                xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/capture_premium_transport_proof.gd -- --phase="$phase" --state="$state" --width="$w" --height="$h" --output="screenshots/transport-$phase-$state-$dims.png" 2>&1 | tee /tmp/last-capture.log
                grep -q 'TRANSPORT REAL GODOT CAPTURE PASSED' /tmp/last-capture.log
                ! grep -E 'SCRIPT ERROR:|Parse Error:|TRANSPORT CAPTURE FAILURE:|ERROR:' /tmp/last-capture.log
              done
            done
          done
          python3 - <<'PY'
          import glob,struct
          files=glob.glob('screenshots/transport-*.png')
          assert len(files)==36,len(files)
          for file in files:
            with open(file,'rb') as f:head=f.read(24)
            assert head[:8]==bytes.fromhex('89504e470d0a1a0a'),file
            assert struct.unpack('>II',head[16:24]) in [(390,844),(720,1280),(1280,720),(1600,900)],file
          print('TRANSPORT 36 ACTUAL GODOT RENDERS VERIFIED')
          PY
      - name: Upload original-material Godot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livin-the-dream-transport-36-native-screens
          path: screenshots/transport-*.png
          retention-days: 21
          if-no-files-found: warn
