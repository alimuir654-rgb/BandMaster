name: Scene worlds day-night visual lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Scripts/scene_world_theme.gd'
      - 'Art/UI/Tour/**'
      - 'poc/tour_controls_lab.*'
      - 'tests/tour_control_lab_tests.gd'
      - 'tests/capture_tour_controls.gd'
      - 'poc/scene_worlds_day_night.*'
      - 'tests/scene_world_theme_tests.gd'
      - 'tests/capture_scene_worlds.gd'
      - '.github/workflows/scene-worlds-lab.yml'
jobs:
  godot-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Godot 4.7.2 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip libgl1 libx11-6
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and validate scene-world tokens
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script res://tests/scene_world_theme_tests.gd
          godot --headless --path . --script res://tests/tour_control_lab_tests.gd
      - name: Capture day dusk night in three viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for dims in 390x844 720x1280 1280x720; do
            w="${dims%x*}"; h="${dims#*x}"
            for phase in day dusk night; do
              xvfb-run -a godot --rendering-method gl_compatibility --path . --script res://tests/capture_scene_worlds.gd -- --family=tour --phase="$phase" --width="$w" --height="$h" --output="screenshots/tour-$phase-$dims.png"
            done
          done
          xvfb-run -a godot --rendering-method gl_compatibility --path . --script res://tests/capture_scene_worlds.gd -- --family=songwriting --phase=day --width=390 --height=844 --output=screenshots/songwriting-day-390x844.png
          xvfb-run -a godot --rendering-method gl_compatibility --path . --script res://tests/capture_scene_worlds.gd -- --family=gig --phase=night --width=1280 --height=720 --output=screenshots/gig-night-1280x720.png
          for dims in 390x844 720x1280 1280x720; do
            w="${dims%x*}"; h="${dims#*x}"
            for phase in day dusk; do
              xvfb-run -a godot --rendering-method gl_compatibility --path . --script res://tests/capture_tour_controls.gd -- --phase="$phase" --width="$w" --height="$h" --output="screenshots/tour-controls-$phase-$dims.png"
            done
          done
          python3 - <<'PY'
          import glob, struct
          paths=glob.glob("screenshots/*.png")
          assert len(paths)==17, (len(paths),paths)
          for p in paths:
              with open(p,"rb") as f: header=f.read(24)
              assert header[:8]==bytes.fromhex("89504e470d0a1a0a"), p
              w,h=struct.unpack(">II",header[16:24])
              assert (w,h) in [(390,844),(720,1280),(1280,720)], (p,w,h)
          print("Validated",len(paths),"actual Godot PNG captures")
          PY
      - name: Upload actual-render screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-worlds-day-night-visual-lab
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
