name: Godot headless validation

on:
  push:
  pull_request:

jobs:
  godot-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project and parse scripts/scenes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit --verbose 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:' /tmp/godot-import.log; then
            echo "Godot reported script or resource errors"
            exit 1
          fi
      - name: Smoke-test startup scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:' /tmp/godot-startup.log; then
            echo "Godot reported errors at startup"
            exit 1
          fi
      - name: Run deterministic career regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/career_regression.gd 2>&1 | tee /tmp/career-tests.log
          grep -q 'CAREER REGRESSION TESTS PASSED' /tmp/career-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|REGRESSION FAILURE:|ERROR:' /tmp/career-tests.log; then
            exit 1
          fi
      - name: Simulate 720 career decisions across six player styles
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/career_playtest_lab.gd 2>&1 | tee /tmp/playtest-lab.log
          grep -q 'CAREER PLAYTEST LAB PASSED' /tmp/playtest-lab.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PLAYTEST FAILURE:|ERROR:' /tmp/playtest-lab.log; then
            exit 1
          fi
      - name: Run band drama choice tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/band_drama_tests.gd 2>&1 | tee /tmp/band-drama.log
          grep -q 'BAND DRAMA TESTS PASSED' /tmp/band-drama.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|BAND DRAMA FAILURE:|ERROR:' /tmp/band-drama.log; then
            exit 1
          fi
      - name: Verify member life events and recruitment
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/member_life_tests.gd 2>&1 | tee /tmp/member-life.log
          grep -q 'MEMBER LIFE TESTS PASSED' /tmp/member-life.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|MEMBER LIFE FAILURE:|ERROR:' /tmp/member-life.log; then
            exit 1
          fi
      - name: Validate auditions and session player rescue
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/session_audition_tests.gd 2>&1 | tee /tmp/session-auditions.log
          grep -q 'SESSION AND AUDITION TESTS PASSED' /tmp/session-auditions.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|SESSION TEST FAILURE:|ERROR:' /tmp/session-auditions.log; then
            exit 1
          fi
      - name: Validate rehearsal and songwriting chemistry
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/band_chemistry_tests.gd 2>&1 | tee /tmp/chemistry-tests.log
          grep -q 'BAND CHEMISTRY TESTS PASSED' /tmp/chemistry-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|CHEMISTRY FAILURE:|ERROR:' /tmp/chemistry-tests.log; then
            exit 1
          fi
      - name: Verify first-month chapters and rewards
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/career_chapters_tests.gd 2>&1 | tee /tmp/chapter-tests.log
          grep -q 'FIRST MONTH CHAPTER TESTS PASSED' /tmp/chapter-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|CHAPTER FAILURE:|ERROR:' /tmp/chapter-tests.log; then
            exit 1
          fi
      - name: Validate reusable narrative UI components
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/ui_component_tests.gd 2>&1 | tee /tmp/ui-components.log
          grep -q 'UI COMPONENT TESTS PASSED' /tmp/ui-components.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|UI COMPONENT FAILURE:|ERROR:' /tmp/ui-components.log; then
            exit 1
          fi
      - name: Test conversations and scrapbook presentation
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/career_presentation_tests.gd 2>&1 | tee /tmp/presentation-tests.log
          grep -q 'PRESENTATION TESTS PASSED' /tmp/presentation-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PRESENTATION FAILURE:|ERROR:' /tmp/presentation-tests.log; then
            exit 1
          fi
      - name: Test safe local dialogue adapter
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/local_dialogue_adapter_tests.gd 2>&1 | tee /tmp/local-dialogue-tests.log
          grep -q 'LOCAL DIALOGUE ADAPTER TESTS PASSED' /tmp/local-dialogue-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|LOCAL DIALOGUE FAILURE:|ERROR:' /tmp/local-dialogue-tests.log; then
            exit 1
          fi
      - name: Validate scrapbook filtering
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/scrapbook_filter_tests.gd 2>&1 | tee /tmp/scrapbook-filter.log
          grep -q 'SCRAPBOOK FILTER TESTS PASSED' /tmp/scrapbook-filter.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|SCRAPBOOK FAILURE:|ERROR:' /tmp/scrapbook-filter.log; then
            exit 1
          fi
      - name: Smoke-test dedicated CareerHub scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --scene res://Scenes/CareerHub.tscn --quit-after 6 2>&1 | tee /tmp/career-hub.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call|Invalid get index|ERROR: Failed loading resource:' /tmp/career-hub.log; then
            exit 1
          fi
