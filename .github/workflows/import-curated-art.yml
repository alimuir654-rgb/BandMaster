name: Import curated Unsplash photographs
on:
  push:
    branches:
      - assets/curated-icons-photo-import
    paths:
      - scripts/import_curated_unsplash.sh
      - .github/workflows/import-curated-art.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify selected free photos
        shell: bash
        run: bash scripts/import_curated_unsplash.sh
      - name: Record imported binaries on the asset branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Art/Photography/approved/*.jpg
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            git commit -m "Import curated original Unsplash photographs"
            git push origin HEAD:assets/curated-icons-photo-import
          fi
