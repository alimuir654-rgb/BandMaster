      - tools/song64_ci_dependencies.py

permissions:
  contents: read

concurrency:
  group: linked-song-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  models:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/playtest-polish-v20'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BM57_BASELINE: f077696bc0fa36b5db2874061290eb3d9cd94860
      BM57_TOOLCHAIN: /tmp/song57-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
      BM57_WORK: /tmp/song57-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Check current scoped preflight and preserved history
        env:
          BM57_BEFORE: ${{ github.event.before }}
        run: |
          python3 tools/project_context.py check
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from improvement_gate import check
          current = json.loads(Path('docs/continuous_improvement/CURRENT.json').read_text())
          print(json.dumps(check(Path.cwd(), current['session'], os.environ['BM57_BEFORE'], True)))
          PY

      - name: Check model dependency trigger coverage
        run: |
          python3 tools/song64_ci_dependencies.py
          python3 -m unittest discover -s tests -p test_song64_ci_dependencies.py -v

      - name: Download and verify the established Godot 4.7.2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$BM57_TOOLCHAIN"
          archive="$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64.zip"
          engine="$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            --output "$archive" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$archive" | sha256sum --check --strict -
          unzip -q "$archive" -d "$BM57_TOOLCHAIN"
          printf '%s  %s\n' 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e "$engine" | sha256sum --check --strict -
          chmod u+x "$engine"

      - name: Prove actual legacy compatibility and new craft fairness
        run: |
          python3 tools/song57_verify.py \
            --repo "$GITHUB_WORKSPACE" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --baseline "$BM57_BASELINE" \
            --work "$BM57_WORK"

      - name: Prove canonical song identity against genuine previous completions
        shell: bash
        run: |
          set -euo pipefail
          baseline_source="$BM57_WORK/song58-baseline-source"
          mkdir "$baseline_source"
          git archive f95a19618c3d30b21628f5150bfa5f97be270e12 | tar -x -C "$baseline_source"
          python3 tools/song58_verify.py \
            --repo "$GITHUB_WORKSPACE" \
            --baseline-source "$baseline_source" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --work "$BM57_WORK/song58-proof"

      - name: Prove chosen collaborator and paid retained contribution evidence
        shell: bash
        run: |
          set -euo pipefail
          baseline_source="$BM57_WORK/song59-baseline-source"
          mkdir "$baseline_source"
          git archive 91d966511ecad06b942e4a1a33da98c93845bb3f | tar -x -C "$baseline_source"
          python3 tools/song59_verify.py \
            --repo "$GITHUB_WORKSPACE" \
            --baseline-source "$baseline_source" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --work "$BM57_WORK/song59-proof"

      - name: Prove atomic pending lead and collaborator payload compatibility
        shell: bash
        run: |
          set -euo pipefail
          baseline_source="$BM57_WORK/song60-baseline-source"
          mkdir "$baseline_source"
          git archive fd7a5e24b34b17cf741c4aab14a8c7798e17ddc5 | tar -x -C "$baseline_source"
          python3 tools/song60_verify.py --models \
            --repo "$GITHUB_WORKSPACE" \
            --baseline-source "$baseline_source" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --work "$BM57_WORK/song60-proof"

      - name: Prove exact-revision rehearsal and whole-opening rollback
        shell: bash
        run: |
          set -euo pipefail
          baseline_source="$BM57_WORK/song61-baseline-source"
          mkdir "$baseline_source"
          git archive 94878408b16e787284ee32a3ffcd323e74be674b | tar -x -C "$baseline_source"
          python3 tools/song61_verify.py \
            --repo "$GITHUB_WORKSPACE" \
            --baseline-source "$baseline_source" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --work "$BM57_WORK/song61-proof"

      - name: Prove conservative section provenance and legacy rehearsal compatibility
        shell: bash
        run: |
          set -euo pipefail
          baseline_source="$BM57_WORK/song63-baseline-source"
          mkdir "$baseline_source"
          git archive 0f2762740babb5586ec68e95ad6900a108b8c0f1 | tar -x -C "$baseline_source"
          python3 tools/song63_verify.py \
            --repo "$GITHUB_WORKSPACE" \
            --baseline-source "$baseline_source" \
            --godot "$BM57_TOOLCHAIN/Godot_v4.7.2-stable_linux.x86_64" \
            --work "$BM57_WORK/song63-proof"

      - name: Retain source hashes, logs and isolated model fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song57-models-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          # Fixtures contain only the harness-created QA band, never owner saves.
          path: |
            ${{ env.BM57_WORK }}/RUN.json
            ${{ env.BM57_WORK }}/logs/*.log
            ${{ env.BM57_WORK }}/logs/*.json
            ${{ env.BM57_WORK }}/results/*.json
            ${{ env.BM57_WORK }}/song58-proof/RUN.json
            ${{ env.BM57_WORK }}/song58-proof/logs/*.log
            ${{ env.BM57_WORK }}/song58-proof/baseline-songs.json
            ${{ env.BM57_WORK }}/song59-proof/RUN.json
            ${{ env.BM57_WORK }}/song59-proof/logs/*.log
            ${{ env.BM57_WORK }}/song59-proof/baseline-songs.json
            ${{ env.BM57_WORK }}/song60-proof/RUN.json
            ${{ env.BM57_WORK }}/song60-proof/logs/*.log
            ${{ env.BM57_WORK }}/song60-proof/baseline-songs.json
            ${{ env.BM57_WORK }}/song61-proof/RUN.json
            ${{ env.BM57_WORK }}/song61-proof/logs/*.log
            ${{ env.BM57_WORK }}/song61-proof/baseline-songs.json
            ${{ env.BM57_WORK }}/song63-proof/RUN.json
            ${{ env.BM57_WORK }}/song63-proof/logs/*.log
            ${{ env.BM57_WORK }}/song63-proof/baseline-songs.json
