      - experiments/playable_flightcase/rehearsal_intent.gd
      - experiments/playable_flightcase/review_policy.gd
      - experiments/playable_flightcase/scene_circuit.gd
      - experiments/playable_flightcase/session.gd
      - experiments/playable_flightcase/show_flow.gd
      - experiments/playable_flightcase/situation_core.gd
      - experiments/playable_flightcase/situation_jam.gd
      - experiments/playable_flightcase/situation_practice.gd
      - experiments/playable_flightcase/song_fragment_content.gd
      - experiments/playable_flightcase/song_preparation.gd
      - experiments/playable_flightcase/song_workbench.gd
