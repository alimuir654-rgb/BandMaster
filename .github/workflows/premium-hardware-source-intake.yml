name: Premium hardware — owner ZIP source intake
on:
  push:
    branches:
      - premium-hardware-eight-control-families-2026-10-27
    paths:
      - BandMaster_Hardware_Repo_Import.zip
      - .github/workflows/premium-hardware-source-intake.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-audit-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify archive and extract only allowlisted paths without overwriting existing files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import stat
          from zipfile import ZipFile
          name = pathlib.Path('BandMaster_Hardware_Repo_Import.zip')
          if not name.is_file():
              raise SystemExit('Owner source import ZIP has not been uploaded to the PR #193 branch')
          expect = 'b772f37726a275025cc96e7bd68ef71a1abe751149c8b6c20351afa6c2550ed9'
          data = name.read_bytes()
          assert hashlib.sha256(data).hexdigest() == expect, 'Unexpected hardware import ZIP: checksum mismatch'
          with ZipFile(name) as z:
              files = [info for info in z.infolist() if not info.is_dir()]
              assert z.testzip() is None and len(files) == 132, 'Corrupted or incomplete source ZIP'
              paths = []
              for info in files:
                  p = pathlib.PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(mode), f'Unsafe archive member {p}'
                  allowed = (p.parts[0] == 'bandmaster_premium_controls_lab' or
                             p.parts[:3] == ('Art','References','PremiumHardware') or
                             str(p) in ('tools/validate_premium_hardware_source.py',
                                         'docs/PREMIUM_HARDWARE_SOURCE_INTAKE.md'))
                  assert allowed, f'Unexpected archive member {p}'
                  assert not pathlib.Path(info.filename).exists(), f'Would overwrite existing project file: {p}'
                  paths.append(info)
              for info in paths:
                  p = pathlib.Path(info.filename)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(info))
          print('Validated expected owner archive; extracted 132 new source files without overwrites.')
          PY
          python tools/validate_premium_hardware_source.py
          python -m pip install --disable-pip-version-check Pillow
          python bandmaster_premium_controls_lab/validate_assets.py
      - name: Commit source files only on the dedicated draft branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Art/References/PremiumHardware bandmaster_premium_controls_lab \
                  tools/validate_premium_hardware_source.py docs/PREMIUM_HARDWARE_SOURCE_INTAKE.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source files changed'; exit 0; }
          git commit -m 'Intake approved-source Lab 05 references, Lab 07 states, Lab 08.4 LED overlay patch'
          git push origin HEAD:premium-hardware-eight-control-families-2026-10-27
