name: Recruitment recovery — verified one-time ZIP intake
on:
  push:
    branches: [first-pass-scene-sweep-2026-10-27]
    paths:
      - 'BandMaster_Recruitment_Quality_Recovery_Repo_Pack_2026-10-28.zip'
      - '.github/workflows/recruitment-recovery-zip-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recruitment-recovery-zip-intake
  cancel-in-progress: false
jobs:
  verify-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify original owner ZIP, exact member hashes and existing AGENTS.md
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          root=pathlib.Path('.')
          zip_path=root/'BandMaster_Recruitment_Quality_Recovery_Repo_Pack_2026-10-28.zip'
          expected_zip='7ab3131c6974075cc65486e8f2d81191163652141e71fe9b14089d3068393130'
          if not zip_path.is_file() or hashlib.sha256(zip_path.read_bytes()).hexdigest()!=expected_zip:
              raise SystemExit('STOP: ZIP missing or bytes differ from verified owner package')
          import subprocess
          original=subprocess.check_output(['git','hash-object','AGENTS.md'],text=True).strip()
          if original not in ('951d72bb11bd4147917922e8e15214c71cc816d8',
                              'e6decb1024fe30d5349d449a136e3a7a7f7ebede'):
              raise SystemExit('STOP: AGENTS.md has changed since package was prepared; reconcile manually')
          with zipfile.ZipFile(zip_path) as z:
              infos=[i for i in z.infolist() if not i.is_dir()]
              if len(infos)!=27 or z.testzip() is not None:
                  raise SystemExit('STOP: wrong member count or corrupt archive')
              manifest={}
              for line in z.read('PACKAGE_SHA256.txt').decode('utf-8').splitlines():
                  if not line.strip(): continue
                  digest,filename=line.split('  ',1)
                  if filename in manifest: raise SystemExit('duplicate manifest entry')
                  manifest[filename]=digest
              names={i.filename for i in infos}
              if names != set(manifest)|{'PACKAGE_SHA256.txt'}:
                  raise SystemExit('STOP: manifest does not match full archive inventory')
              if 'AGENTS.md' not in names or '.github/workflows/recruitment-recovery-plan.yml' not in names:
                  raise SystemExit('STOP: required root contract/workflow missing')
              for info in infos:
                  name=info.filename
                  p=pathlib.PurePosixPath(name)
                  mode=info.external_attr>>16
                  if (p.is_absolute() or '..' in p.parts or not p.parts or
                      '\\' in name or stat.S_ISLNK(mode) or info.file_size>2000000):
                      raise SystemExit(f'STOP: unsafe package member {name}')
                  if p.parts[0] not in ('.agents','.github','Art','docs','tests','tools') and name not in ('AGENTS.md','README_IMPORT.md','PACKAGE_SHA256.txt'):
                      raise SystemExit(f'STOP: member outside approved roots {name}')
                  if p.parts[:2] == ('.github','workflows') and name != '.github/workflows/recruitment-recovery-plan.yml':
                      raise SystemExit(f'STOP: unexpected workflow {name}')
                  data=z.read(info)
                  if name!='PACKAGE_SHA256.txt' and hashlib.sha256(data).hexdigest()!=manifest[name]:
                      raise SystemExit(f'STOP: member hash mismatch {name}')
                  target=root/name
                  if name!='AGENTS.md' and target.exists() and target.read_bytes()!=data:
                      raise SystemExit(f'STOP: existing file differs {name}')
              new_agents=z.read('AGENTS.md')
              old_agents=(root/'AGENTS.md').read_bytes()
              if old_agents not in new_agents:
                  raise SystemExit('STOP: new AGENTS does not preserve exact previous contents')
              if b'# RECRUITMENT QUALITY RECOVERY' not in new_agents:
                  raise SystemExit('STOP: missing current mission in AGENTS')
              for info in infos:
                  target=root/info.filename
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info))
          print('27 exact files unpacked; previous AGENTS preserved in full.')
          PY
      - name: Validate staged contract and deliberately blocked art gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/recruitment_quality_gate.py --root . --stage prep
          python3 -m unittest discover -s tests -p test_recruitment_quality_gate.py -v
          if python3 tools/recruitment_quality_gate.py --root . --stage art; then
            echo 'ERROR: art gate should not pass without approved source art' >&2
            exit 1
          fi
          git diff --check
      - name: Commit imported planning resources to draft branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README_IMPORT.md PACKAGE_SHA256.txt .agents/recruitment             .agents/skills/recruitment-screen-recovery .github/workflows/recruitment-recovery-plan.yml             Art/RecruitmentRecovery docs/recruitment_recovery             tools/recruitment_quality_gate.py tools/recruitment_scope_guard.py             tools/register_recruitment_asset.py tests/test_recruitment_quality_gate.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'All exact recovery files already present; no change'
          else
            git commit -m 'Install verified one-screen recruitment recovery guardrails'
            git push origin HEAD:first-pass-scene-sweep-2026-10-27
          fi
          echo 'ENGINEERING PLANNING GATE ONLY; ART P0 AND OWNER SIGNOFF STILL BLOCKED.'
