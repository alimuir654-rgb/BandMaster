name: Sprint 08 scene convergence and typography
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Art/Fonts/**'
      - 'Scripts/scene_world_typography.gd'
      - 'poc/scene_worlds_convergence.*'
      - 'tests/scene_worlds_convergence_tests.gd'
      - 'tests/capture_scene_worlds_convergence.gd'
      - '.github/workflows/scene-worlds-convergence.yml'
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Godot 4.7.2 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip libgl1 libx11-6
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import OFL font files and run cross-family tests
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script res://tests/scene_world_theme_tests.gd
          godot --headless --path . --script res://tests/scene_worlds_convergence_tests.gd
      - name: Capture real renderer typography gallery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for dims in 390x844 720x1280 1280x720; do
            w="${dims%x*}"; h="${dims#*x}"
            for family in tour songwriting gig; do
              for phase in day night; do
                xvfb-run -a godot --rendering-method gl_compatibility --path . --script res://tests/capture_scene_worlds_convergence.gd -- --family="$family" --phase="$phase" --width="$w" --height="$h" --output="screenshots/convergence-$family-$phase-$dims.png"
              done
            done
          done
          python3 - <<'PY'
          import glob, struct
          paths=glob.glob("screenshots/convergence-*.png")
          assert len(paths)==18,(len(paths),paths)
          for path in paths:
              with open(path,"rb") as f: header=f.read(24)
              assert header[:8]==bytes.fromhex("89504e470d0a1a0a"),path
              assert struct.unpack(">II",header[16:24]) in [(390,844),(720,1280),(1280,720)],path
          print("18 actual Godot typography gallery screenshots verified")
          PY
      - name: Upload actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint08-convergence-godot
          path: screenshots/convergence-*.png
          if-no-files-found: warn
          retention-days: 14
