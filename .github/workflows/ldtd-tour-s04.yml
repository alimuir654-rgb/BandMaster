name: Livin The Dream S04 — itinerary and van booking first pass
on:
  push:
    branches: [first-pass-scene-sweep-2026-10-27]
    paths:
      - 'Scripts/ldtd_tour_planning_preview.gd'
      - 'Scripts/ldtd_tour_ticket.gd'
      - 'poc/ldtd_tour_planning.*'
      - 'Art/UI/TourCraft/**'
      - 'tests/ldtd_s04_tour_tests.gd'
      - 'tests/capture_ldtd_s04_tour.gd'
      - '.github/workflows/ldtd-tour-s04.yml'
      - 'tools/check_scene_sprint_preflight.py'
  workflow_dispatch:
concurrency:
  group: ldtd-s04-tour
  cancel-in-progress: true
jobs:
  tour-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-authorised S04 preflight and prior review
        run: python3 tools/check_scene_sprint_preflight.py --sprint S04
      - name: Install Godot 4.7.2 and native renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip libgl1 libx11-6
          curl --fail --location --retry 3 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Verify real photo source and purpose-made original five-state ticket textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for family in ('venue','route','seal','commit'):
              for state in ('idle','hover','pressed','selected','disabled'):
                  path=Path(f'Art/UI/TourCraft/{family}_{state}.svg')
                  assert path.is_file(),path
                  data=path.read_text()
                  assert '<svg' in data and 'gradient' in data.lower() and 'viewBox' in data,path
                  assert not any(s in data for s in ('BRISTOL','CARDIFF','£','CASH','VAN HEALTH')),f'Live data baked into {path}'
          for path in ('Art/UI/TourCraft/itinerary_sheet.svg','Art/UI/TourCraft/route_map.svg',
                       'Art/Photography/Formation/corkboard_day_pexels.webp',
                       'Art/Photography/Formation/SOURCE_PHOTO_MANIFEST.json',
                       'Art/Backgrounds/shared/home.webp',
                       'Art/Fonts/BarlowCondensed-SemiBold.ttf',
                       'Art/Fonts/IBMPlexSans-Variable.ttf'):
              assert Path(path).is_file(),path
          print('S04 original authored 20 state textures, two substrates, source-backed photo and font VERIFIED')
          PY
      - name: Import and test actual authoritative touring and isolated booking model
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:' /tmp/import.log
          for script in tests/sprint01_touring_tests.gd tests/ldtd_s04_tour_tests.gd; do
            godot --headless --audio-driver Dummy --path . --script "res://$script" 2>&1 | tee /tmp/test.log
            ! grep -E 'SCRIPT ERROR:|Parse Error:|S04 FAILURE:|ERROR:' /tmp/test.log
          done
          grep -q 'LDTD S04 TOUR MODEL, VAN LOAD AND ONCE-ONLY BOOKING TESTS PASSED' /tmp/test.log
      - name: Capture actual Godot mobile tablet landscape desktop DAY and NIGHT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for dims in 390x844 720x1280 1280x720 1600x900; do
            w="${dims%x*}"; h="${dims#*x}"
            xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/capture_ldtd_s04_tour.gd -- --stage=planning --phase=day --width="$w" --height="$h" --output="screenshots/s04-planning-day-$dims.png" 2>&1 | tee /tmp/capture.log
            grep -q 'LDTD S04 ACTUAL GODOT SCREENSHOT PASSED' /tmp/capture.log
            ! grep -E 'SCRIPT ERROR:|Parse Error:|SCREENSHOT FAILURE:|ERROR:' /tmp/capture.log
          done
          xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/capture_ldtd_s04_tour.gd -- --stage=confirmed --phase=night --width=1280 --height=720 --output=screenshots/s04-confirmed-night-1280x720.png 2>&1 | tee /tmp/capture.log
          grep -q 'LDTD S04 ACTUAL GODOT SCREENSHOT PASSED' /tmp/capture.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|SCREENSHOT FAILURE:|ERROR:' /tmp/capture.log
          python3 - <<'PY'
          from pathlib import Path
          import struct
          paths=list(Path('screenshots').glob('s04-*.png'))
          assert len(paths)==5,paths
          for path in paths:
              data=path.read_bytes()[:24]
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a'),path
              assert struct.unpack('>II',data[16:24]) in {(390,844),(720,1280),(1280,720),(1600,900)},path
          print('S04 FIVE NATIVE GODOT SCREENSHOT DIMENSIONS VERIFIED')
          PY
      - name: Upload real S04 Godot renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livin-the-dream-s04-tour-five-godot
          path: screenshots/s04-*.png
          if-no-files-found: warn
          retention-days: 21
