name: Isolated opening journey native proof
on:
  push:
    branches: [dual-frame-proof-2026-10-28]
    paths:
      - 'experiments/playable_flightcase/**'
      - '.github/workflows/playable-flightcase.yml'
permissions:
  contents: read
concurrency:
  group: bandmaster-opening-native
  cancel-in-progress: false
jobs:
  opening:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify current preflight, exclusive writer and commit deadline
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          SESSION=$(python3 -c 'import json; print(json.load(open("docs/continuous_improvement/CURRENT.json"))["session"])')
          python3 tools/improvement_gate.py check --session "$SESSION" --before "$BEFORE" --require-prior-record
          python3 - <<'PY'
          import json,subprocess,datetime
          current=json.load(open('docs/continuous_improvement/CURRENT.json'))
          session=json.load(open(current['session']))
          p=json.load(open('docs/asset_base/CONTROL_SPRINT_LOCK.json'))
          assert current['session']=='docs/continuous_improvement/sessions/'+session['id']+'.json'
          assert session['status']=='active' and session['owner_approved'] is False
          assert p['writer'].startswith(session['id']+'-')
          assert p['base_head']==session['baseline_sha']
          assert p['expires_at']==session['scope_end']
          authored=datetime.datetime.fromisoformat(subprocess.check_output(['git','show','-s','--format=%cI','HEAD'],text=True).strip())
          claimed=datetime.datetime.fromisoformat(p['claimed_at'])
          expiry=datetime.datetime.fromisoformat(p['expires_at'])
          assert claimed <= authored <= expiry, (claimed,authored,expiry)
          PY
      - name: Install verified Godot 4.7.2 and native screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxrender1 libxi6 libxcursor1 libxrandr2 >/dev/null
          curl -fsSL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Assemble and test isolated opening and C26 gameplay
        shell: bash
        run: |
          mkdir -p /tmp/c27-opening/{Scripts,experiments,Data,Art/References,components}
          cp -r Scripts/. /tmp/c27-opening/Scripts/
          cp -r experiments/character_cast /tmp/c27-opening/experiments/
          cp -r experiments/playable_flightcase /tmp/c27-opening/experiments/
          cp -r Data/CharacterCast /tmp/c27-opening/Data/
          cp -r Art/References/ApprovedCast20261029 /tmp/c27-opening/Art/References/
          cp -r components/control_atlas /tmp/c27-opening/components/
          printf 'config_version=5\n[application]\nconfig/name="Livin The Dream isolated opening"\nrun/main_scene="res://experiments/playable_flightcase/opening.tscn"\n' > /tmp/c27-opening/project.godot
          set -o pipefail
          timeout 110s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/c27-opening --script res://experiments/playable_flightcase/native_test.gd 2>&1 | tee /tmp/c27-old-gameplay.log
          timeout 110s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/c27-opening --script res://experiments/playable_flightcase/opening_test.gd 2>&1 | tee /tmp/c27-opening-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/c27-old-gameplay.log /tmp/c27-opening-test.log; then exit 1; fi
          grep -q 'C26_GAMEPLAY_RESULT' /tmp/c27-old-gameplay.log
          grep -q 'C27_OPENING_RESULT' /tmp/c27-opening-test.log
          git diff --exit-code -- Scripts Art/References Data/CharacterCast components
      - name: Import original source-backed PNG assets into isolated Godot project
        shell: bash
        run: |
          set -o pipefail
          test -s /tmp/c27-opening/components/control_atlas/art/control_action_flightcase_active.png
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path /tmp/c27-opening --import 2>&1 | tee /tmp/c27-editor-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/c27-editor-import.log; then exit 1; fi
          find /tmp/c27-opening/.godot/imported -name 'control_action_flightcase_active.png*' -type f | grep -q .
      - name: Capture real Godot GL pixels on four supported viewports
        shell: bash
        run: |
          set -o pipefail
          for view in 390x844 720x1280 1280x720 1600x900; do
            export CAPTURE_WIDTH="${view%x*}" CAPTURE_HEIGHT="${view#*x}"
            timeout 100s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path /tmp/c27-opening --rendering-method gl_compatibility --script res://experiments/playable_flightcase/opening_capture.gd 2>&1 | tee "/tmp/c27-capture-${view}.log"
            grep -q 'C27_CAPTURE_RESULT' "/tmp/c27-capture-${view}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' "/tmp/c27-capture-${view}.log"; then exit 1; fi
          done
      - name: Verify project entry and package playable isolated Godot candidate
        if: success()
        shell: bash
        run: |
          set -o pipefail
          test -s /tmp/c27-opening/experiments/playable_flightcase/opening.tscn
          timeout 45s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path /tmp/c27-opening --rendering-method gl_compatibility --quit-after 3 2>&1 | tee /tmp/c27-project-launch.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/c27-project-launch.log; then exit 1; fi
          cd /tmp/c27-opening
          rm -rf .godot
          zip -q -r /tmp/livin-the-dream-isolated-godot-4.7.2.zip .
          unzip -t /tmp/livin-the-dream-isolated-godot-4.7.2.zip | tail -1
          sha256sum /tmp/livin-the-dream-isolated-godot-4.7.2.zip | tee /tmp/c27-project-zip-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: livin-the-dream-playable-opening-source
          path: /tmp/livin-the-dream-isolated-godot-4.7.2.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c27-native-opening-test-and-four-viewports
          path: |
            /tmp/c27-*.log
            /tmp/c27-*.png
          retention-days: 30
